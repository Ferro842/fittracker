function useAppState() {
const [logs, setLogs] = useState({});
const [trainingen, setTrain] = useState({});
const [progressie, setProg] = useState({ ferro:[], partner:[] });
const [doelen, setDoelen] = useState({ ferro:{…DEF_DOEL}, partner:{…DEF_DOEL} });
const [bibl, setBibl] = useState([]);
const [klaar, setKlaar] = useState(false);

useEffect(() => {
Promise.all([DB.get(“ft_logs”),DB.get(“ft_train”),DB.get(“ft_prog”),DB.get(“ft_doelen”),DB.get(“ft_bibl”)])
.then(([l,t,p,d,b]) => {
if(l) setLogs(l); if(t) setTrain(t); if(p) setProg(p); if(d) setDoelen(d); if(b) setBibl(b);
setKlaar(true);
});
}, []);

const updLog = (pid, datum, fn) => setLogs(prev => {
const k = pid+”*”+datum;
const u = {…prev, [k]: fn(prev[k]||{})};
DB.set(“ft_logs”, u); return u;
});
const updTrain = (pid, datum, fn) => setTrain(prev => {
const k = pid+”*”+datum;
const u = {…prev, [k]: fn(prev[k]||[])};
DB.set(“ft_train”, u); return u;
});
const updProg = (pid, fn) => setProg(prev => {
const u = {…prev, [pid]: fn(prev[pid]||[])};
DB.set(“ft_prog”, u); return u;
});
const updDoel = (pid, d) => setDoelen(prev => {
const u = {…prev, [pid]: d}; DB.set(“ft_doelen”, u); return u;
});
const addBibl = (p) => setBibl(prev => {
if(prev.find(x=>x.naam.toLowerCase()===p.naam.toLowerCase())) return prev;
const u = [p,…prev].slice(0,300); DB.set(“ft_bibl”, u); return u;
});

return { logs, trainingen, progressie, doelen, bibl, klaar, updLog, updTrain, updProg, updDoel, addBibl };
}

async function zoekBarcode(code, setStatus, onSelect) {
code = (code || “”).trim();
if (!code) return;
setStatus(“laden”);

// 1. Lokale database eerst (instant)
if (BARCODE_DB[code]) {
const p = BARCODE_DB[code];
onSelect({ naam:p.naam, kcal:p.kcal, eiwit:p.eiwit, koolhydraten:p.koolhydraten, vet:p.vet, portie:p.portie });
setStatus(””);
return;
}

// 2. Open Food Facts API - exacte data van verpakking
try {
const url = “https://world.openfoodfacts.org/api/v2/product/” + code + “.json?fields=product_name_nl,product_name,brands,nutriments,serving_size,serving_quantity”;
const res = await fetch(url, {
headers: { “User-Agent”: “FitTracker - Dutch fitness app - contact@fittracker.nl” }
});
if (res.ok) {
const data = await res.json();
if (data.status === 1 && data.product) {
const p = data.product;
const n = p.nutriments || {};
const naam = p.product_name_nl || p.product_name || “Onbekend product”;
const merk = p.brands ? p.brands.split(”,”)[0].trim() : “”;
const kcal = Math.round(n[“energy-kcal_100g”] || (n[“energy_100g”] || 0) / 4.184);
const eiwit = Math.round((n[“proteins_100g”] || 0) * 10) / 10;
const koolh = Math.round((n[“carbohydrates_100g”] || 0) * 10) / 10;
const vet = Math.round((n[“fat_100g”] || 0) * 10) / 10;
const servingGram = p.serving_quantity || parseFloat(p.serving_size) || 100;
const servingLabel = p.serving_size || “100g”;
onSelect({
naam: naam + (merk ? “ (” + merk + “)” : “”),
kcal, eiwit, koolhydraten: koolh, vet,
portie: { label: servingLabel, gram: servingGram }
});
setStatus(””);
return;
}
}
} catch(e) {
console.log(“OFF API fout:”, e);
}

// 3. Claude API als fallback
try {
const res = await fetch(“https://api.anthropic.com/v1/messages”, {
method: “POST”,
headers: {
“Content-Type”: “application/json”,
“anthropic-dangerous-direct-browser-access”: “true”
},
body: JSON.stringify({
model: “claude-sonnet-4-20250514”,
max_tokens: 400,
messages: [{
role: “user”,
content: “Barcode “ + code + “ - welk Nederlands supermarktproduct? Antwoord ALLEEN met JSON zonder tekst: {gevonden:true,naam:string,kcal:number,eiwit:number,koolhydraten:number,vet:number,portie_gram:number,portie_label:string} of {gevonden:false}”
}]
})
});
if (res.ok) {
const data = await res.json();
const raw = ((data.content || [])[0] || {}).text || “”;
const match = raw.match(/{[^{}]*}/);
if (match) {
const p = JSON.parse(match[0]);
if (p.gevonden) {
onSelect({
naam: p.naam || “Onbekend”,
kcal: Math.round(Number(p.kcal) || 0),
eiwit: Math.round((Number(p.eiwit) || 0) * 10) / 10,
koolhydraten: Math.round((Number(p.koolhydraten) || 0) * 10) / 10,
vet: Math.round((Number(p.vet) || 0) * 10) / 10,
portie: { label: p.portie_label || “100g”, gram: Number(p.portie_gram) || 100 }
});
setStatus(””);
return;
}
}
}
} catch(e) {}

setStatus(“niet_gevonden”);
}

function CameraScanner({ onResult, onClose }) {
const videoRef = useRef(null);
const streamRef = useRef(null);
const intervalRef = useRef(null);
const [status, setStatus] = useState(“starting”);

useEffect(() => {
startCamera();
return () => stopCamera();
}, []);

const startCamera = async () => {
try {
const stream = await navigator.mediaDevices.getUserMedia({
video: { facingMode: “environment”, width: { ideal: 1280 }, height: { ideal: 720 } }
});
streamRef.current = stream;
if (videoRef.current) {
videoRef.current.srcObject = stream;
await videoRef.current.play();
setStatus(“scanning”);
if (“BarcodeDetector” in window) {
const detector = new BarcodeDetector({ formats: [“ean_13”,“ean_8”,“upc_a”,“upc_e”] });
intervalRef.current = setInterval(async () => {
if (videoRef.current && videoRef.current.readyState === 4) {
try {
const codes = await detector.detect(videoRef.current);
if (codes.length > 0) {
clearInterval(intervalRef.current);
stopCamera();
onResult(codes[0].rawValue);
}
} catch(e) {}
}
}, 300);
} else {
setStatus(“no_detector”);
}
}
} catch(e) { setStatus(“error”); }
};

const stopCamera = () => {
if (intervalRef.current) clearInterval(intervalRef.current);
if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
};

return (
<div style={{ position:“fixed”, inset:0, background:”#000”, zIndex:200, display:“flex”, flexDirection:“column” }}>
<div style={{ display:“flex”, justifyContent:“space-between”, alignItems:“center”, padding:“16px 20px”, background:“rgba(0,0,0,0.8)” }}>
<span style={{ color:”#fff”, fontWeight:700, fontSize:16 }}>Scan barcode</span>
<button onClick={() => { stopCamera(); onClose(); }} style={{ background:”#374151”, border:“none”, borderRadius:99, width:34, height:34, color:”#fff”, fontSize:18, cursor:“pointer” }}>x</button>
</div>
<div style={{ flex:1, position:“relative”, overflow:“hidden” }}>
<video ref={videoRef} style={{ width:“100%”, height:“100%”, objectFit:“cover” }} playsInline muted />
<div style={{ position:“absolute”, inset:0, display:“flex”, alignItems:“center”, justifyContent:“center” }}>
<div style={{ width:280, height:160, border:“3px solid #22c55e”, borderRadius:12, boxShadow:“0 0 0 9999px rgba(0,0,0,0.55)” }}/>
</div>
{status === “scanning” && <div style={{ position:“absolute”, bottom:40, left:0, right:0, textAlign:“center”, color:”#22c55e”, fontWeight:700 }}>Richt op de barcode</div>}
{status === “no_detector” && (
<div style={{ position:“absolute”, bottom:40, left:20, right:20, background:“rgba(0,0,0,0.85)”, borderRadius:12, padding:16, textAlign:“center” }}>
<p style={{ color:”#fff”, fontSize:13, marginBottom:6 }}>Live scanner niet beschikbaar in deze browser.</p>
<p style={{ color:”#9ca3af”, fontSize:12 }}>Gebruik de foto-optie hieronder.</p>
</div>
)}
{status === “error” && <div style={{ position:“absolute”, bottom:40, left:20, right:20, background:“rgba(0,0,0,0.85)”, borderRadius:12, padding:16, textAlign:“center” }}><p style={{ color:”#ef4444”, fontSize:13 }}>Geen camera toegang. Controleer instellingen.</p></div>}
</div>
</div>
);
}

const verwerkFoto = async (file) => {
if (!file) return;
setStatus(“laden”);
try {
const b64 = await new Promise((resolve, reject) => {
const reader = new FileReader();
reader.onload = (ev) => resolve(ev.target.result.split(”,”)[1]);
reader.onerror = reject;
reader.readAsDataURL(file);
});
const mediaType = (file.type || “image/jpeg”);
const res = await fetch(“https://api.anthropic.com/v1/messages”, {
method: “POST”,
headers: {
“Content-Type”: “application/json”,
“anthropic-dangerous-direct-browser-access”: “true”
},
body: JSON.stringify({
model: “claude-sonnet-4-20250514”,
max_tokens: 600,
messages: [{
role: “user”,
content: [
{ type: “image”, source: { type: “base64”, media_type: mediaType, data: b64 } },
{ type: “text”, text: “Kijk naar deze foto van een voedselverpakking. Lees de barcode EN de voedingswaardentabel. Geef ALLEEN dit JSON terug zonder extra tekst: {gevonden:true,barcode:string,naam:string,kcal_per_100g:number,eiwit_per_100g:number,koolhydraten_per_100g:number,vet_per_100g:number,portie_gram:number,portie_label:string}. Gebruik ALTIJD de exacte getallen van de voedingswaardentabel op de verpakking. Als je de tabel niet kunt lezen, gebruik dan alleen de barcode met {gevonden:true,barcode:string,naam:string,kcal_per_100g:0,…}. Als niets leesbaar: {gevonden:false}” }
]
}]
})
});
if (!res.ok) { setStatus(“fout”); return; }
const data = await res.json();
if (data.type === “error”) { setStatus(“fout”); return; }
const raw = ((data.content || [])[0] || {}).text || “”;
const match = raw.match(/{[\s\S]*?}/);
if (!match) { setStatus(“niet_gevonden”); return; }
const p = JSON.parse(match[0]);
if (!p.gevonden) { setStatus(“niet_gevonden”); return; }
if (p.barcode) setBarcode(String(p.barcode));
onSelect({
naam: p.naam || “Onbekend product”,
kcal: Math.round(Number(p.kcal_per_100g) || 0),
eiwit: Math.round((Number(p.eiwit_per_100g) || 0) * 10) / 10,
koolhydraten: Math.round((Number(p.koolhydraten_per_100g) || 0) * 10) / 10,
vet: Math.round((Number(p.vet_per_100g) || 0) * 10) / 10,
portie: { label: p.portie_label || “100g”, gram: Number(p.portie_gram) || 100 }
});
setStatus(””);
} catch (err) {
console.error(“verwerkFoto fout:”, err);
setStatus(“fout”);
}
};

return (

<div style={{ background:”#f0fdf4”, borderRadius:12, padding:“12px 14px”, fontSize:13, color:”#166534”, marginBottom:12 }}>

function VoedingScherm({ profiel, datum, logs, updLog, doelen, updDoel, bibl, addBibl }) {
const [voegToeModal, setVoegToeModal] = useState(null);
const [kopierenModal, setKopierenModal] = useState(null);

const p = profiel;
const key = p.id+”_”+datum;
const log = logs[key]||{};
const doel = doelen[p.id]||DEF_DOEL;

useEffect(() => { setDTemp({…doel}); }, [p.id]);

const alleItems = Object.values(log).reduce((a,b)=>a.concat(b),[]);
const gegetenItems = alleItems.filter(i=>i.gegeten);
const totaal = gegetenItems.reduce((a,i)=>({ kcal:a.kcal+i.kcal, eiwit:a.eiwit+i.eiwit, koolhydraten:a.koolhydraten+i.koolhydraten, vet:a.vet+i.vet }),{ kcal:0, eiwit:0, koolhydraten:0, vet:0 });
const gepland = alleItems.reduce((a,i)=>a+i.kcal,0);
const over = Math.max(0, doel.kcal-totaal.kcal);
const pctG = Math.min(100, doel.kcal>0 ? (totaal.kcal/doel.kcal)*100 : 0);
const pctP = Math.min(100, doel.kcal>0 ? (gepland/doel.kcal)*100 : 0);

const isGesel = (m, id) => geselecteerd.includes(m+”|”+id);

const toggleGesel = (m, id) => {
const k = m+”|”+id;
setGeselecteerd(prev => prev.includes(k) ? prev.filter(x=>x!==k) : […prev,k]);
};

const startSelectie = (m, id) => {
setSelectieModus(true);
setGeselecteerd([m+”|”+id]);
};

const sluitSelectie = () => { setSelectieModus(false); setGeselecteerd([]); };

const markeerGegeten = (alsGegeten) => {
geselecteerd.forEach(k => {
const [m, idStr] = k.split(”|”);
updLog(p.id, datum, l => ({ …l, [m]: (l[m]||[]).map(i => i.id===Number(idStr) ? {…i, gegeten:alsGegeten} : i) }));
});
setToast(geselecteerd.length+” items als “+(alsGegeten?“gegeten”:“niet gegeten”)+” gemarkeerd”);
sluitSelectie();
};

// Knop logica: toon “Niet gegeten” alleen als ALLE geselecteerd al gegeten zijn
const alleGesel_zijnGegeten = geselecteerd.length > 0 && geselecteerd.every(k => {
const [m, idStr] = k.split(”|”);
return !!(log[m]||[]).find(i => i.id===Number(idStr) && i.gegeten);
});

const verwijderSelectie = () => {
geselecteerd.forEach(k => {
const [m, idStr] = k.split(”|”);
updLog(p.id, datum, l => ({ …l, [m]: (l[m]||[]).filter(i => i.id!==Number(idStr)) }));
});
sluitSelectie();
};

const orig = bewerkItem.item;

setBewerkItem(null); setBewerkGram(””);
};

<div style={{ display:“grid”, gridTemplateColumns:“repeat(7,1fr)”, gap:4 }}>
{d14.map(d => { const {dag,num}=fmtDag(d); const sel=selDagen.includes(d);
return <div key={d} onClick={()=>setSelDagen(p=>p.includes(d)?p.filter(x=>x!==d):[…p,d])} style={{ display:“flex”, flexDirection:“column”, alignItems:“center”, gap:2, padding:“6px 2px”, borderRadius:10, background:sel?”#22c55e”:”#f9fafb”, cursor:“pointer” }}>
<span style={{ fontSize:9, color:sel?”#fff”:”#9ca3af” }}>{dag}</span>
<span style={{ fontSize:13, fontWeight:700, color:sel?”#fff”:”#374151” }}>{num}</span>
</div>;
})}
</div>
</div>
<GroteKnop kleur=”#22c55e” onClick={genereer} stijl={{ marginBottom:16 }}>Genereer boodschappenlijst</GroteKnop>
{lijst !== null && (
<div style={{ background:”#fff”, borderRadius:16, padding:“14px 16px”, boxShadow:“0 1px 4px rgba(0,0,0,0.06)” }}>
<div style={{ display:“flex”, justifyContent:“space-between”, alignItems:“center”, marginBottom:12 }}>
<span style={{ fontSize:15, fontWeight:800 }}>Boodschappenlijst</span>
<span style={{ fontSize:12, color:”#9ca3af” }}>{lijst.length} producten</span>
</div>
{lijst.length===0 && <p style={{ color:”#9ca3af”, fontSize:13, textAlign:“center” }}>Geen producten gevonden.</p>}
{lijst.map((item,i) => (
<div key={i} onClick={()=>setAfgevinkt(a=>({…a,[i]:!a[i]}))} style={{ display:“flex”, alignItems:“center”, gap:12, padding:“10px 0”, borderBottom:“1px solid #f9fafb”, cursor:“pointer” }}>
<div style={{ width:22, height:22, borderRadius:99, border:“2px solid “+(afgevinkt[i]?”#22c55e”:”#d1d5db”), background:afgevinkt[i]?”#22c55e”:“transparent”, flexShrink:0, display:“flex”, alignItems:“center”, justifyContent:“center” }}>
{afgevinkt[i] && <svg width="12" height="12" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
</div>
<div style={{ flex:1 }}>
<div style={{ fontSize:13, fontWeight:700, color:afgevinkt[i]?”#9ca3af”:”#111827”, textDecoration:afgevinkt[i]?“line-through”:“none” }}>{item.naam}</div>
<div style={{ fontSize:11, color:”#9ca3af” }}>{item.gram}g totaal</div>
</div>
</div>
))}
</div>
)}
</div>
);
}

/* ── HOME SCHERM ── */
function HomeScherm({ profiel, datum, setDatum, setTab }) {
const p = profiel;
const days = week7();
return (
<div style={{ paddingBottom:24 }}>
<div style={{ marginBottom:18 }}>
<h1 style={{ fontSize:28, fontWeight:900, color:”#111827”, margin:0 }}>Hallo {p.naam} {p.emoji}</h1>
<p style={{ fontSize:14, color:”#9ca3af”, margin:“4px 0 0” }}>Jouw doelen voor vandaag</p>
</div>
<div style={{ background:”#fff”, borderRadius:16, padding:“14px 12px”, marginBottom:16, boxShadow:“0 1px 4px rgba(0,0,0,0.06)” }}>
<div style={{ display:“flex”, justifyContent:“space-between” }}>
{days.map(d => {
const {dag,num}=fmtDag(d); const isSel=d===datum, isVandaag=d===vandaag();
return (
<div key={d} onClick={()=>setDatum(d)} style={{ display:“flex”, flexDirection:“column”, alignItems:“center”, gap:3, cursor:“pointer” }}>
<span style={{ fontSize:10, color:”#9ca3af” }}>{dag}</span>
<div style={{ width:34, height:34, borderRadius:99, background:isSel?p.kleur:“transparent”, display:“flex”, alignItems:“center”, justifyContent:“center” }}>
<span style={{ fontSize:14, fontWeight:isSel||isVandaag?800:400, color:isSel?”#fff”:isVandaag?p.kleur:”#374151” }}>{num}</span>
</div>
<div style={{ width:4, height:4, borderRadius:99, background:isVandaag?(isSel?”#fff”:p.kleur):“transparent” }}/>
</div>
);
})}
</div>
</div>
<div style={{ display:“grid”, gridTemplateColumns:“1fr 1fr”, gap:10, marginBottom:12 }}>
{[[“🥗”,“Voeding”,“Dagboek”,“voeding”,”#22c55e”],[“💪”,“Training”,“Workout”,“training”,”#3b82f6”],[“📊”,“Progressie”,“Metingen”,“progressie”,”#f97316”],[“🛒”,“Boodschappen”,“Weeklijst”,“boodschappen”,”#8b5cf6”]].map(arr => (
<div key={arr[3]} onClick={()=>setTab(arr[3])} style={{ background:”#fff”, borderRadius:16, padding:“16px 14px”, boxShadow:“0 1px 4px rgba(0,0,0,.06)”, cursor:“pointer”, borderTop:“3px solid “+arr[4] }}>
<div style={{ fontSize:26, marginBottom:6 }}>{arr[0]}</div>
<div style={{ fontSize:14, fontWeight:800, color:”#111827” }}>{arr[1]}</div>
<div style={{ fontSize:11, color:”#9ca3af” }}>{arr[2]}</div>
</div>
))}
</div>
</div>
);
}
